openapi: 3.1.0
info:
  version: 0.0.1
  title: Athenz client sidecar API
  contact:
    email: "cncf-athenz-maintainers@lists.cncf.io"
    name: Athenz
    url: https://www.athenz.io/contact.html
  license:
    name: Apache 2.0
    identifier: Apache-2.0
servers:
  - description: localhost
    url: http://localhost:8080
paths:
  /awstempcred:
    get:
      summary: Fetch cached credentials for the AWS container credential provider
      description: Set AWS_CONTAINER_CREDENTIALS_FULL_URI to this URL with a percent-encoded role_arn. Uses the same cache as POST.
      operationId: GetAWSTemporaryCredentials
      parameters:
        - name: role_arn
          in: query
          required: true
          description: IAM role ARN allowed by the configured Roles Anywhere profile and IAM trust policy
          schema:
            type: string
            minLength: 1
            maxLength: 2048
        - name: duration_seconds
          in: query
          description: Requested session lifetime. The role and profile must allow this duration.
          schema:
            type: integer
            minimum: 900
            maximum: 43200
            default: 900
      responses:
        "200":
          description: AWS container credential provider compatible response
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AWSContainerCredentialsResponse'
        "400":
          description: Invalid, unknown or repeated query parameters, role ARN or duration
        "404":
          description: AWS credentials or the token server REST API is disabled
        "405":
          description: Only GET and POST are supported
        "503":
          description: Credential provisioning failed or timed out and no usable cache remains
    post:
      summary: Fetch cached AWS IAM Roles Anywhere temporary credentials
      description: Uses the configured trust anchor, profile and SIA service certificate. AWS enforces role access and session duration limits.
      operationId: FetchAWSTemporaryCredentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AWSTemporaryCredentialsRequestBody'
      responses:
        "200":
          description: AWS credential_process compatible response
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AWSTemporaryCredentialsResponse'
        "400":
          description: Invalid request body, role ARN or duration
        "404":
          description: AWS credentials or the token server REST API is disabled
        "405":
          description: Only GET and POST are supported
        "503":
          description: Credential provisioning failed or timed out and no usable cache remains
  /accesstoken:
    post:
      summary: Fetch cached access token
      operationId: FetchAccessToken
      requestBody:
        $ref: '#/components/requestBodies/atRequestBody'
      responses:
        "200":
          $ref: '#/components/responses/atResponse'
        "500":
          $ref: '#/components/responses/InternalServerError'
  /roletoken:
    post:
      summary: Fetch cached role token
      operationId: FetchRoleToken
      requestBody:
        $ref: '#/components/requestBodies/rtRequestBody'
      responses:
        "200":
          $ref: '#/components/responses/rtResponse'
        "500":
          $ref: '#/components/responses/InternalServerError'
components:
  requestBodies:
    atRequestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AccessTokenRequestBody'
          examples:
            sample:
              value:
                domain: domain.shopping
                role: users
                proxy_for_principal: ""
                expiry: 1800
    rtRequestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RoleTokenRequestBody'
          examples:
            sample:
              value:
                domain: domain.shopping
                role: users
                proxy_for_principal: ""
                min_expiry: 7200
                max_expiry: 10000
  responses:
    # MethodNotAllowed:
    #   description: Method Not Allowed
    #   content:
    #     "*/*":
    #       examples:
    #         sample:
    #           value: Method Not Allowed
    InternalServerError:
      description: Internal Server Error (includes token not found, errors in requesting Athenz ZTS server, and other internal errors)
      content:
        "*/*":
          examples:
            sample:
              value: Internal Server Error
    atResponse:
      description: access token response
      content: 
        application/json:
          schema:
            $ref: '#/components/schemas/AccessTokenResponse'
          examples:
            sample:
              value:
                access_token: eyJraWQiOiIwIiwidHlwIjoiYXQrand0IiwiYWxnIjoiUlMyNTYifQ..<signature>
                token_type: Bearer
                expires_in: 1800
                scope: domain.shopping:role.users
    rtResponse:
      description: role token response
      content: 
        application/json:
          schema:
            $ref: '#/components/schemas/RoleTokenResponse'
          examples:
            sample:
              value:
                expiryTime: 1528860825
                token: v=Z1;d=domain.shopping;r=users;p=domain.travel.travel-site;h=athenz.co.jp;a=9109ee08b79e6b63;t=1528853625;e=1528860825;k=0;i=192.168.1.1;s=<signature>
  schemas:
    AWSContainerCredentialsResponse:
      type: object
      required:
        - AccessKeyId
        - SecretAccessKey
        - Token
        - Expiration
      properties:
        AccessKeyId:
          type: string
        SecretAccessKey:
          type: string
        Token:
          type: string
        Expiration:
          type: string
          format: date-time
    AWSTemporaryCredentialsRequestBody:
      type: object
      additionalProperties: false
      required:
        - role_arn
      properties:
        role_arn:
          description: IAM role ARN allowed by the configured Roles Anywhere profile and IAM trust policy
          type: string
          minLength: 1
          maxLength: 2048
        duration_seconds:
          description: Requested session lifetime. The role and profile must allow this duration.
          type: integer
          minimum: 900
          maximum: 43200
          default: 900
    AWSTemporaryCredentialsResponse:
      type: object
      required:
        - Version
        - AccessKeyId
        - SecretAccessKey
        - SessionToken
        - Expiration
      properties:
        Version:
          type: integer
          enum: [1]
        AccessKeyId:
          type: string
        SecretAccessKey:
          type: string
        SessionToken:
          type: string
        Expiration:
          type: string
          format: date-time
    AccessTokenRequestBody:
      type: object
      required:
        - domain
      properties:
        domain:
          description: Access token domain name
          minLength: 1
          type: string
        role:
          description: Access token role name (comma separated list)
          minLength: 1
          type: string
        proxy_for_principal:
          description: Access token proxyForPrincipal name
          type: string
        expiry:
          description: Access token expiry time (in second)
          type: integer
    AccessTokenResponse:
      type: object
      required:
        - access_token
        - token_type
        - expires_in
      properties:
        access_token:
          description: Access token string
          type: string
        token_type:
          description: Access token token type
          type: string
        expires_in:
          description: Access token expiry time (in second)
          type: integer
        scope:
          description: Access token scope (Only added if role is not specified, space separated)
          type: string
    RoleTokenRequestBody:
      type: object
      required:
        - domain
      properties:
        domain:
          description: Role token domain name
          minLength: 1
          type: string
        role:
          description: Role token role name (comma separated list)
          minLength: 1
          type: string
        proxy_for_principal:
          description: Role token proxyForPrincipal name
          type: string
        min_expiry:
          description: Role token minimum expiry time (in second)
          type: integer
        max_expiry:
          description: Role token maximum expiry time (in second)
          type: integer
    RoleTokenResponse:
      type: object
      required:
        - expiryTime
        - token
      properties:
        token:
          description: Role token string
          type: string
        expiryTime:
          description: Role token expiry time (Unix timestamp in second)
          type: integer
          x-go-type: int64
