apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: athenz

resources:
- deployment.yaml
- namespace.yaml
- role.yaml
- rolebinding.yaml
- serviceaccount.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
- envs:
  - athenz-sia/athenz-sia.env
  name: client-sia

replacements:
- source:
    fieldPath: data.SERVICEACCOUNT
    kind: ConfigMap
    name: client-sia
    version: v1
  targets:
  - fieldPaths:
    - metadata.name
    options:
      create: true
    select:
      kind: ServiceAccount
      name: client-serviceaccount
      version: v1
  - fieldPaths:
    - spec.template.spec.serviceAccountName
    options:
      create: true
    select:
      kind: Deployment
      name: client-deployment
      version: v1

images:
- name: ghcr.io/ctyano/k8s-athenz-sia:latest
  newName: athenz/k8s-athenz-sia
  newTag: local
